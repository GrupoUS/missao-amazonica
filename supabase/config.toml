# Supabase project configuration for Missão Amazônica – Sal da Terra
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "missao-amazonica"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://missao-amazonica.vercel.app"
additional_redirect_urls = [
  "https://missao-amazonica.vercel.app/admin/redefinir-senha",
  "https://missao-amazonica.vercel.app/admin/login",
  "https://missao-amazonica.vercel.app/admin",
  "https://missao-amazonica-*.vercel.app/admin/redefinir-senha",
  "https://missao-amazonica-*.vercel.app/admin/login",
  "https://missao-amazonica-*.vercel.app/admin",
  "http://localhost:4321/admin/redefinir-senha",
  "http://localhost:4321/admin/login",
  "http://localhost:4321/admin",
]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "missao@missaoamazonica.org"
sender_name = "Missão Amazônica"

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.item-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]
objects_path = "./item-images"

[storage.buckets.accountability-proofs]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "application/pdf"]
objects_path = "./accountability-proofs"

[storage.buckets.donor-uploads]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "application/pdf"]
objects_path = "./donor-uploads"

[realtime]
enabled = true

[edge_runtime]
enabled = false
